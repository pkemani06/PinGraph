[pytest]
testpaths = tests

# Put the repo root on sys.path so tests can import app.* and scripts.seed
# when pytest runs from the project root.
pythonpath = .

# Every test here is async (asyncpg for the database, httpx for the API), so
# auto mode saves a @pytest.mark.asyncio on each one.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
